<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="panel_page_title">LocalStorage Inspector</title>
    <link rel="stylesheet" href="panel.css">
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-box">
                <svg class="icon-search" viewBox="0 0 16 16" fill="none">
                    <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4" />
                    <path d="M10 10l4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                </svg>
                <input type="text" id="searchInput" data-i18n-placeholder="panel_search_placeholder"
                    placeholder="Search key or value... (/ shortcut)" spellcheck="false">
                <button class="btn-clear-search" id="clearSearch" data-i18n-title="panel_clear_search_title"
                    title="Clear search">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <span class="entry-count" id="entryCount">0 items</span>
            <button class="live-toggle active" id="btnLiveToggle" title="Live monitoring">
                <span class="live-dot"></span>
                <span class="live-text" data-i18n="live_status_live">Live</span>
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn-toolbar" id="btnLangToggle" title="Switch language">
                <span class="lang-text">ZH</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnThemeToggle" title="Switch theme">
                <svg viewBox="0 0 16 16" fill="none">
                    <path
                        d="M8 2v2M8 12v2M2 8h2M12 8h2M3.76 3.76l1.42 1.42M10.82 10.82l1.42 1.42M12.24 3.76l-1.42 1.42M5.18 10.82l-1.42 1.42"
                        stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                    <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3" />
                </svg>
                <span class="theme-text" data-i18n="theme_label_light">Light</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnRefresh" data-i18n-title="toolbar_refresh_title" title="Refresh">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L9 7h7V0l-2.35 2.35Z"
                        fill="currentColor" />
                </svg>
                <span data-i18n="toolbar_refresh_label">Refresh</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnAdd" data-i18n-title="toolbar_add_title" title="Add entry (Alt+N)">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span data-i18n="toolbar_add_label">Add</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnImport" data-i18n-title="toolbar_import_title" title="Import JSON">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3M8 2v8M5 7l3 3 3-3" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span data-i18n="toolbar_import_label">Import</span>
            </button>
            <button class="btn-toolbar" id="btnExport" data-i18n-title="toolbar_export_title" title="Export JSON">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3M8 10V2M5 5l3-3 3 3" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span data-i18n="toolbar_export_label">Export</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar btn-danger" id="btnClearAll" data-i18n-title="toolbar_clear_all_title"
                title="Clear all localStorage">
                <svg viewBox="0 0 16 16" fill="none">
                    <path
                        d="M2 4h12M5.33 4V2.67a1.33 1.33 0 0 1 1.34-1.34h2.66a1.33 1.33 0 0 1 1.34 1.34V4m2 0v9.33a1.33 1.33 0 0 1-1.34 1.34H4.67a1.33 1.33 0 0 1-1.34-1.34V4h9.34Z"
                        stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span data-i18n="toolbar_clear_all_label">Clear</span>
            </button>
        </div>
    </div>

    <div class="interaction-hint" aria-live="polite" data-i18n="panel_interaction_hint">
        Tip: double-click Key/Value for quick edit. Double-click blank area in JSON to open the full edit modal.
    </div>

    <div class="main-content" id="mainContent">
        <div class="key-index-column" id="keyIndexColumn">
            <button class="key-index-toggle" id="keyIndexToggle" type="button" aria-label="Toggle key index"
                title="Toggle key index">&gt;&gt;</button>
            <div class="key-index-list" id="keyIndexList"></div>
        </div>

        <div class="table-panel">
            <div class="table-header">
                <div class="col-key" data-i18n="table_header_key">Key</div>
                <div class="col-value" data-i18n="table_header_value">Value</div>
                <div class="col-actions"></div>
            </div>

            <div class="table-body" id="tableBody"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <svg viewBox="0 0 64 64" fill="none" width="48" height="48">
                    <rect x="8" y="12" width="48" height="40" rx="4" stroke="currentColor" stroke-width="2" />
                    <path d="M8 24h48" stroke="currentColor" stroke-width="2" />
                    <circle cx="16" cy="18" r="2" fill="currentColor" />
                    <circle cx="24" cy="18" r="2" fill="currentColor" />
                    <circle cx="32" cy="18" r="2" fill="currentColor" />
                    <path d="M24 38h16M28 44h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <p data-i18n="empty_state_no_data">No localStorage data on this page</p>
                <button class="btn-add-first" id="btnAddFirst" data-i18n="empty_state_add_first">Add first entry</button>
            </div>

            <div class="empty-state" id="noResultsState" style="display:none;">
                <svg viewBox="0 0 64 64" fill="none" width="48" height="48">
                    <circle cx="28" cy="28" r="16" stroke="currentColor" stroke-width="2" />
                    <path d="M40 40l12 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                    <path d="M22 28h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <p data-i18n="empty_state_no_results">No matching entries found</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Entry</h3>
                <button class="btn-modal-close" id="modalClose" data-i18n-aria-label="common_close" aria-label="Close">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalKey" data-i18n="modal_key_label">Key</label>
                    <input type="text" id="modalKey" data-i18n-placeholder="modal_key_placeholder"
                        placeholder="Enter key name" spellcheck="false" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="modalValue">
                        <span data-i18n="modal_value_label">Value</span>
                        <span class="value-type-badge" id="valueTypeBadge">string</span>
                    </label>
                    <textarea id="modalValue" data-i18n-placeholder="modal_value_placeholder"
                        placeholder="Enter value (JSON supported, auto-format)" spellcheck="false" rows="12"></textarea>
                    <div class="form-hint">
                        <span data-i18n="modal_hint_alt_s">Alt+S to save</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancel" data-i18n="common_cancel">Cancel</button>
                <button class="btn-primary" id="modalSave" data-i18n="common_save">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="importModalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="import_modal_title">Import localStorage</h3>
                <button class="btn-modal-close" id="importModalClose" data-i18n-aria-label="common_close"
                    aria-label="Close">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="import-options">
                    <label class="radio-option">
                        <input type="radio" name="importMode" value="merge" checked>
                        <span data-i18n="import_mode_merge">Merge (keep existing data, same key will be overwritten)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="importMode" value="replace">
                        <span data-i18n="import_mode_replace">Replace (clear existing data before import)</span>
                    </label>
                </div>
                <div class="form-group">
                    <label data-i18n="import_source_label">Choose JSON file or paste JSON content</label>
                    <div class="import-drop-zone" id="importDropZone">
                        <svg viewBox="0 0 48 48" fill="none" width="32" height="32">
                            <path d="M24 32V16M18 22l6-6 6 6" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M40 32a8 8 0 0 0-4.46-7.18A10 10 0 0 0 16 22a10 10 0 0 0-.54 2.82A8 8 0 0 0 8 32"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p>Drop JSON file here<br>or <button class="btn-link" id="btnSelectFile">Choose file</button></p>
                        <input type="file" id="importFileInput" accept=".json" style="display:none;">
                    </div>
                    <textarea id="importTextarea" data-i18n-placeholder="import_textarea_placeholder"
                        placeholder='Or paste JSON here, format: {"key":"value", ...}' spellcheck="false"
                        rows="8"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="importCancel" data-i18n="common_cancel">Cancel</button>
                <button class="btn-primary" id="importConfirm" data-i18n="toolbar_import_label">Import</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="confirmOverlay" style="display:none;">
        <div class="modal modal-confirm">
            <div class="modal-header">
                <h3 id="confirmTitle" data-i18n="confirm_default_title">Confirm</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="confirmCancel" data-i18n="common_cancel">Cancel</button>
                <button class="btn-danger-solid" id="confirmOk" data-i18n="common_confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="panel.js"></script>
</body>

</html>
