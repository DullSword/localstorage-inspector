<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Inspector</title>
    <link rel="stylesheet" href="panel.css">
</head>

<body>
    <!-- Toolbar - 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search-box">
                <svg class="icon-search" viewBox="0 0 16 16" fill="none">
                    <path
                        d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM10.7 11.4a5.5 5.5 0 1 1 .7-.7l3.65 3.65a.5.5 0 0 1-.7.7L10.7 11.4Z"
                        fill="currentColor" />
                </svg>
                <input type="text" id="searchInput" placeholder="搜索 key 或 value... (/ 快捷键)" spellcheck="false">
                <button class="btn-clear-search" id="clearSearch" title="清除搜索">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <span class="entry-count" id="entryCount">0 项</span>
            <button class="live-toggle active" id="btnLiveToggle" title="切换实时监控">
                <span class="live-dot"></span>
                <span class="live-text">实时</span>
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn-toolbar" id="btnThemeToggle" title="切换到亮色主题">
                <svg viewBox="0 0 16 16" fill="none">
                    <path
                        d="M8 2v2M8 12v2M2 8h2M12 8h2M3.76 3.76l1.42 1.42M10.82 10.82l1.42 1.42M12.24 3.76l-1.42 1.42M5.18 10.82l-1.42 1.42"
                        stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
                    <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3" />
                </svg>
                <span class="theme-text">亮色</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnRefresh" title="手动刷新">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L9 7h7V0l-2.35 2.35Z"
                        fill="currentColor" />
                </svg>
                <span>刷新</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnAdd" title="新增条目 (Alt+N)">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>新增</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar" id="btnImport" title="导入 JSON">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3M8 2v8M5 7l3 3 3-3" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>导入</span>
            </button>
            <button class="btn-toolbar" id="btnExport" title="导出 JSON">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M2 10v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3M8 10V2M5 5l3-3 3 3" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>导出</span>
            </button>
            <div class="toolbar-divider"></div>
            <button class="btn-toolbar btn-danger" id="btnClearAll" title="清空所有 localStorage">
                <svg viewBox="0 0 16 16" fill="none">
                    <path
                        d="M2 4h12M5.33 4V2.67a1.33 1.33 0 0 1 1.34-1.34h2.66a1.33 1.33 0 0 1 1.34 1.34V4m2 0v9.33a1.33 1.33 0 0 1-1.34 1.34H4.67a1.33 1.33 0 0 1-1.34-1.34V4h9.34Z"
                        stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>清空</span>
            </button>
        </div>
    </div>

    <div class="interaction-hint" aria-live="polite">
        提示：双击 Key/Value 可快速编辑，双击 JSON 空白区域可打开完整编辑弹窗。
    </div>

    <!-- Main Content - 主内容区 -->
    <div class="main-content">
        <!-- Table Header - 表头 -->
        <div class="table-header">
            <div class="col-key">Key</div>
            <div class="col-value">Value</div>
            <div class="col-actions"></div>
        </div>

        <!-- Table Body - 表体 -->
        <div class="table-body" id="tableBody">
            <!-- Entries will be rendered here - 条目将在此渲染 -->
        </div>

        <!-- Empty State - 空状态 -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <svg viewBox="0 0 64 64" fill="none" width="48" height="48">
                <rect x="8" y="12" width="48" height="40" rx="4" stroke="currentColor" stroke-width="2" />
                <path d="M8 24h48" stroke="currentColor" stroke-width="2" />
                <circle cx="16" cy="18" r="2" fill="currentColor" />
                <circle cx="24" cy="18" r="2" fill="currentColor" />
                <circle cx="32" cy="18" r="2" fill="currentColor" />
                <path d="M24 38h16M28 44h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <p>当前页面没有 localStorage 数据</p>
            <button class="btn-add-first" id="btnAddFirst">添加第一条数据</button>
        </div>

        <!-- No Results State - 无结果状态 -->
        <div class="empty-state" id="noResultsState" style="display:none;">
            <svg viewBox="0 0 64 64" fill="none" width="48" height="48">
                <circle cx="28" cy="28" r="16" stroke="currentColor" stroke-width="2" />
                <path d="M40 40l12 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                <path d="M22 28h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <p>没有找到匹配的条目</p>
        </div>
    </div>

    <!-- Add/Edit Modal - 新增/编辑模态框 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增条目</h3>
                <button class="btn-modal-close" id="modalClose">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalKey">Key</label>
                    <input type="text" id="modalKey" placeholder="输入 key 名称" spellcheck="false" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="modalValue">
                        Value
                        <span class="value-type-badge" id="valueTypeBadge">string</span>
                    </label>
                    <textarea id="modalValue" placeholder="输入值（支持 JSON 格式，自动格式化）" spellcheck="false"
                        rows="12"></textarea>
                    <div class="form-hint">
                        <span>Alt+S 保存</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Import Modal - 导入模态框 -->
    <div class="modal-overlay" id="importModalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>导入 localStorage</h3>
                <button class="btn-modal-close" id="importModalClose">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="import-options">
                    <label class="radio-option">
                        <input type="radio" name="importMode" value="merge" checked>
                        <span>合并（保留现有数据，相同 key 会被覆盖）</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="importMode" value="replace">
                        <span>替换（清空现有数据后导入）</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>选择 JSON 文件或粘贴 JSON 内容</label>
                    <div class="import-drop-zone" id="importDropZone">
                        <svg viewBox="0 0 48 48" fill="none" width="32" height="32">
                            <path d="M24 32V16M18 22l6-6 6 6" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M40 32a8 8 0 0 0-4.46-7.18A10 10 0 0 0 16 22a10 10 0 0 0-.54 2.82A8 8 0 0 0 8 32"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p>拖拽 JSON 文件到此处<br>或 <button class="btn-link" id="btnSelectFile">选择文件</button></p>
                        <input type="file" id="importFileInput" accept=".json" style="display:none;">
                    </div>
                    <textarea id="importTextarea" placeholder='或在此粘贴 JSON 内容，格式: {"key": "value", ...}'
                        spellcheck="false" rows="8"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="importCancel">取消</button>
                <button class="btn-primary" id="importConfirm">导入</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification - 提示通知 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Confirm Dialog - 确认对话框 -->
    <div class="modal-overlay" id="confirmOverlay" style="display:none;">
        <div class="modal modal-confirm">
            <div class="modal-header">
                <h3 id="confirmTitle">确认操作</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger-solid" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <script src="panel.js"></script>
</body>

</html>
